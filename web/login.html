<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bars Register - Login</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header role="banner">
    <div class="navbar" aria-label="Barra de navegação">
      <div class="brand">Bars Register</div>
      <nav aria-label="Principal">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="products.html">Produtos</a></li>
          <li><a href="pos.html">Vendas</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="login.html">Entrar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="conteudo" class="container-narrow" tabindex="-1">
    <h1 class="center">Entrar</h1>
    <form id="loginForm" novalidate aria-describedby="loginHelp" role="form">
      <p id="loginHelp" class="form-help">Preencha seu usuário e senha para acessar.</p>
      <div class="form-field">
        <label for="usuario">Usuário</label>
        <input id="usuario" name="usuario" class="input" type="text" required aria-required="true" />
        <div id="erro-usuario" class="form-error" aria-live="polite"></div>
      </div>
      <div class="form-field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" class="input" type="password" required aria-required="true" />
        <div id="erro-senha" class="form-error" aria-live="polite"></div>
      </div>
      <button type="submit" class="btn btn-primary">Entrar</button>
      <button type="reset" class="btn btn-outline">Limpar</button>
    </form>
    <div id="loginFeedback" class="form-help" aria-live="polite" style="margin-top: 12px"></div>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container">
      <p>© 2025 Bars Register. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
