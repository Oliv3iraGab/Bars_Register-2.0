<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bars Register - Início</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header role="banner">
    <div class="navbar" aria-label="Barra de navegação">
      <div class="brand">Bars Register</div>
      <nav aria-label="Principal">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="products.html">Produtos</a></li>
          <li><a href="pos.html">Vendas</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="conteudo" tabindex="-1">
    <div class="grid-2">
      <section class="card" aria-labelledby="titulo-vendas-totais">
        <h2 id="titulo-vendas-totais" class="section-title">Vendas Totais</h2>
        <p id="vendasTotais"><strong>R$ 0,00</strong></p>
        <p class="form-help">Atualiza dinamicamente com base em dados mock.</p>
      </section>
      <section class="card" aria-labelledby="titulo-itens">
        <h2 id="titulo-itens" class="section-title">Produtos Vendidos</h2>
        <p id="itensVendidos"><strong>0</strong></p>
      </section>
    </div>

    <section class="card" style="margin-top: 16px" aria-labelledby="titulo-grafico">
      <h2 id="titulo-grafico" class="section-title">Gráfico de Vendas Mensais</h2>
      <div id="grafico" class="chart" aria-hidden="true"></div>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container">
      <p>© 2025 Bars Register. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
