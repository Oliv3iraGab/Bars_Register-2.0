<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bars Register - Produtos</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header role="banner">
    <div class="navbar" aria-label="Barra de navegação">
      <div class="brand">Bars Register</div>
      <nav aria-label="Principal">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="products.html">Produtos</a></li>
          <li><a href="pos.html">Vendas</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="login.html">Entrar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="conteudo" tabindex="-1">
    <h1>Produtos</h1>

    <section class="card" aria-labelledby="titulo-cadastro">
      <h2 id="titulo-cadastro" class="section-title">Cadastrar Produto</h2>
      <form id="productForm" class="grid-3" autocomplete="off">
        <div class="form-field">
          <label for="productName">Nome</label>
          <input id="productName" class="input" placeholder="Ex: Coca-Cola" />
        </div>
        <div class="form-field">
          <label for="productPrice">Preço (R$)</label>
          <input id="productPrice" type="number" step="0.01" class="input" placeholder="0.00" />
        </div>
        <div class="form-field">
          <label for="productStock">Estoque</label>
          <input id="productStock" type="number" min="0" class="input" placeholder="0" />
        </div>
        <div>
          <button class="btn btn-primary" type="submit">Cadastrar</button>
          <p id="formFeedback" class="form-help" aria-live="polite" style="margin-top: 8px"></p>
        </div>
      </form>
    </section>

    <section class="card" style="margin-top: 16px" aria-labelledby="titulo-lista">
      <h2 id="titulo-lista" class="section-title">Lista de Produtos</h2>
      <div class="grid-2" style="margin-bottom: 12px;">
        <div class="form-field">
          <label for="searchInput">Pesquisar</label>
          <input id="searchInput" class="input" placeholder="Nome ou preço" />
        </div>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="produtosBody"></tbody>
      </table>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container">
      <p>© 2025 Bars Register. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/products.js"></script>
</body>
</html>
