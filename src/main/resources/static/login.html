<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bars Register - Login</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header role="banner">
    <div class="navbar" aria-label="Barra de navegação">
      <div class="brand">Bars Register</div>
      <nav aria-label="Principal">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="products.html">Produtos</a></li>
          <li><a href="pos.html">Vendas</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="login.html">Entrar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="conteudo" tabindex="-1" class="container-narrow">
    <h1>Entrar</h1>
    <section class="card" aria-labelledby="titulo-login">
      <h2 id="titulo-login" class="section-title">Acesso</h2>
      <form id="loginForm" autocomplete="off">
        <div class="form-field">
          <label for="username">Usuário</label>
          <input id="username" class="input" placeholder="Seu usuário" />
        </div>
        <div class="form-field">
          <label for="password">Senha</label>
          <input id="password" type="password" class="input" placeholder="Sua senha" />
        </div>
        <button class="btn btn-primary" type="submit">Entrar</button>
        <p id="loginFeedback" class="form-help" aria-live="polite" style="margin-top: 8px"></p>
      </form>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container">
      <p>© 2025 Bars Register. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
